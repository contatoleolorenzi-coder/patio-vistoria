*{box-sizing:border-box}
body{background:var(--chao);color:var(--tinta);font:15px/1.5 var(--f-txt);-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:16px;font-weight:600}
.sub{color:var(--tinta-2);font-size:14px}
.rotulo{font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.marca-bar{background:var(--topo-bg);color:#fff;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));margin-top:-12px;margin-bottom:4px;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--ouro);display:flex;align-items:center;justify-content:space-between;gap:12px}

     avarias:[{id:'a1',zona:'pc_d',tipo:'Risco',grav:'Leve',obs:'Risco de 8 cm no canto esquerdo'},{id:'a2',zona:'porta_te',tipo:'Amassado',grav:'Média',obs:'Amassado pequeno perto da maçaneta'},{id:'a3',zona:'paralama_td',tipo:'Risco',grav:'Leve',obs:'Risco que não estava na entrada'}]},

    {id:'ex-1',exemplo:true,tipo:'entrada',placa:'RTA4E21',modelo:'Onix LTZ 1.0 Turbo 2021',cor:'Prata',km:'48.210',comb:5,cliente:'Cliente de exemplo',vistoriador:'Exemplo',criadoEm:at(9,12),concluidoEm:at(9,31),status:'assinada',fotos:{},itens:Object.assign({},tudo,{manual:false}),obs:'Veio sem manual.',
     avarias:[{id:'b1',zona:'pc_d',tipo:'Risco',grav:'Leve',obs:'Risco de 8 cm no canto esquerdo'},{id:'b2',zona:'porta_te',tipo:'Amassado',grav:'Média',obs:'Amassado pequeno perto da maçaneta'}]}

/* ---------- estado e armazenamento ---------- */
const S={lista:[],view:'painel',cur:null,step:0,filtro:'todas',busca:'',sheet:null,modo:'local',carregando:true};
const CACHE={}; // url -> dataURL para o PDF

const IDB={db:null,abrir(){return new Promise(r=>{try{const q=indexedDB.open('patio',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})},
  get(k){return new Promise(r=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
  set(k,v){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}};
async function iniciar(){
  S.lista=lsGet('patio_vist_v1',[]);
  if(await IDB.abrir()){const l=await IDB.get('lista');if(Array.isArray(l))S.lista=l}

  cap('assets').then(a=>{ASSETS=a});

  });

const filaSalvar={};

  if(v.exemplo)return;

}
function limpo(v){
  const c=JSON.parse(JSON.stringify(v));
  const ok=f=>f&&f.url&&!String(f.url).startsWith('data:');
  Object.keys(c.fotos||{}).forEach(k=>{if(!ok(c.fotos[k]))delete c.fotos[k]});
  (c.avarias||[]).forEach(a=>{if(a.foto&&!ok(a.foto))delete a.foto});
  return c;
}
let gravando=Promise.resolve();
function gravar(v){
  if(S.modo==='db'&&DB){
    const dados=limpo(v);delete dados.id;
    gravando=gravando.then(()=>DB.collection('vistorias').doc(v.id).set(dados)).catch(e=>{toast('Não salvou na nuvem: '+(e&&e.message||'erro')+'. Tente de novo.')});

    if(IDB.db)IDB.set('lista',JSON.parse(JSON.stringify(S.lista)));else lsSet('patio_vist_v1',S.lista.map(limpo));

  if(v.tipo!=='entrega'||!v.placa)return null;

}

  const e=acharEntrada(v); if(!e)return null;
  const base=new Set((e.avarias||[]).map(a=>a.zona+'|'+a.tipo));
  return {entrada:e,ids:new Set((v.avarias||[]).filter(a=>!base.has(a.zona+'|'+a.tipo)).map(a=>a.id))};
}

  s+=`<text class="tl" x="231" y="250" text-anchor="middle" transform="rotate(90 231 250)" ${P?'fill="#506170" font-size="10" font-family="Helvetica"':''}>DIR · PASSAGEIRO</text>`;
  s+=`<rect class="corpo" x="32" y="16" width="176" height="434" rx="48" ${P?'fill="#C8D1DA"':''}/>`;
  ZONAS.forEach(z=>{
    const l=por[z.k],cls='z'+(z.vidro?' vidro':'')+(l?(l.some(a=>nv.has(a.id))?' novo':' av'):'');
    const at=o.int?` tabindex="0" role="button" data-act="zona" data-z="${z.k}" aria-label="${esc(z.n)}${l?', '+l.length+' avaria(s)':''}"`:'';
    s+=`<rect class="${cls}" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="${z.rx}"${at} ${P?`fill="${cor(z)}" stroke="${l?'#C4321F':'#FFFFFF'}" stroke-width="2"`:''}><title>${esc(z.n)}</title></rect>`;
  });
  Object.keys(por).forEach(k=>{const z=ZMAP[k];if(!z)return;const cx=z.x+z.w/2,cy=z.y+z.h/2;const n=por[k].length;
    s+=`<g class="mk" pointer-events="none"><circle cx="${cx}" cy="${cy}" r="10" ${P?'fill="#8E1F10"':''}/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" ${P?'fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Helvetica"':''}>${n}</text></g>`});
  return s+'</svg>';
}

/* ---------- foto: comprime e carimba placa, data e ângulo ---------- */
function carregarImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function processarFoto(file,legenda){
  const url=URL.createObjectURL(file);
  try{
    const img=await carregarImg(url);const max=1600;const k=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.round(img.width*k),h=Math.round(img.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
    const bh=Math.max(28,Math.round(w*0.045));g.fillStyle='rgba(8,16,26,.72)';g.fillRect(0,h-bh,w,bh);
    g.fillStyle='#fff';g.font=`600 ${Math.round(bh*0.5)}px Poppins, Arial, sans-serif`;g.textBaseline='middle';
    g.fillText(`PLATINA  ·  ${fmtPlaca(S.cur.placa)||'SEM PLACA'}  ·  ${dtLong(new Date().toISOString())}  ·  ${legenda}`,Math.round(bh*0.4),h-bh/2);
    const dataUrl=c.toDataURL('image/jpeg',0.8);
    if(ASSETS){
      try{const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));const up=await ASSETS.upload(blob,{type:'image/jpeg'});CACHE[up.url]=dataUrl;return {id:up.id,url:up.url}}
      catch(e){toast('Foto ficou só neste aparelho: '+(e&&e.message||'envio falhou'))}
    }
    CACHE[dataUrl]=dataUrl;return {id:null,url:dataUrl};
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- assinatura ---------- */
function iniciarAssinaturas(){
  [['sig-cli','assinCliente'],['sig-vist','assinVist']].forEach(([id,campo])=>{
    const c=document.getElementById(id);if(!c)return;
    const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
    const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0F1E33';
    if(S.cur[campo])carregarImg(S.cur[campo]).then(i=>g.drawImage(i,0,0,r.width,r.height)).catch(()=>{});
    let des=false,ult=null;
    const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
    c.onpointerdown=e=>{des=true;ult=pt(e);c.setPointerCapture(e.pointerId)};
    c.onpointermove=e=>{if(!des)return;const p=pt(e);g.beginPath();g.moveTo(ult[0],ult[1]);g.lineTo(p[0],p[1]);g.stroke();ult=p};
    c.onpointerup=c.onpointercancel=()=>{if(!des)return;des=false;
      const o=document.createElement('canvas');o.width=600;o.height=200;const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,600,200);og.drawImage(c,0,0,600,200);
      S.cur[campo]=o.toDataURL('image/jpeg',0.7);salvar(S.cur);atualizarRodape()};
  });
}
function atualizarRodape(){const b=document.querySelector('[data-act="concluir"]');if(b)b.disabled=!podeConcluir(S.cur)}

/* ---------- PDF ---------- */
async function paraDataURL(url){
  if(!url)return null;if(CACHE[url])return CACHE[url];if(url.startsWith('data:'))return url;
  try{const b=await (await fetch(url)).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}catch(e){return null}
}
async function svgParaPng(svg){
  const img=await carregarImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
  const c=document.createElement('canvas');c.width=480;c.height=968;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,480,968);g.drawImage(img,0,0,480,968);return c.toDataURL('image/png');
}

    case'filtro':S.filtro=t.dataset.v;render();break;
    case'abrir':{const x=listaVisivel().find(y=>y.id===t.dataset.id);if(!x)break;S.cur=JSON.parse(JSON.stringify(x));Object.assign(CACHE,{});S.view=x.status==='assinada'||x.exemplo?'ver':'editar';S.step=0;render();scrollTo(0,0);break}
    case'voltar':S.view='painel';S.cur=null;S.sheet=null;render();scrollTo(0,0);break;
    case'editar':S.view='editar';S.step=0;render();break;
    case'passo':S.step=+t.dataset.v;render();scrollTo(0,0);break;
    case'prox':S.step=Math.min(4,S.step+1);render();scrollTo(0,0);break;
    case'ant':S.step=Math.max(0,S.step-1);render();scrollTo(0,0);break;
    case'tipo':v.tipo=t.dataset.v;salvar(v);render();break;
    case'comb':v.comb=+t.dataset.v;salvar(v);render();break;
    case'semAvaria':v.semAvaria=t.checked;salvar(v);break;
    case'item':v.itens=v.itens||{};v.itens[t.dataset.k]=t.dataset.v==='1';salvar(v);render();break;
    case'zona':S.sheet={zona:t.dataset.z,av:{id:uid(),zona:t.dataset.z,tipo:'',grav:'',obs:''},edit:false};render();break;
    case'editAv':{const x=v.avarias.find(y=>y.id===t.dataset.id);S.sheet={zona:x.zona,av:JSON.parse(JSON.stringify(x)),edit:true};render();break}
    case'avCampo':S.sheet.av[t.dataset.c]=t.dataset.v;render();break;
    case'fecharSheet':S.sheet=null;render();break;
    case'avSalvar':{const av=S.sheet.av,i=v.avarias.findIndex(y=>y.id===av.id);if(i<0)v.avarias.push(av);else v.avarias[i]=av;v.semAvaria=false;S.sheet=null;salvar(v);render();toast('Avaria salva em '+ZMAP[av.zona].n+'.');break}
    case'avDel':v.avarias=v.avarias.filter(y=>y.id!==S.sheet.av.id);S.sheet=null;salvar(v);render();break;
    case'limparSig':{const c=document.getElementById('sig-'+t.dataset.v);c.getContext('2d').clearRect(0,0,c.width,c.height);v[t.dataset.v==='cli'?'assinCliente':'assinVist']=null;salvar(v);atualizarRodape();break}
    case'concluir':if(!podeConcluir(v))break;v.status='assinada';v.concluidoEm=new Date().toISOString();salvar(v);S.view='ver';render();scrollTo(0,0);toast('Vistoria concluída e assinada.');break;
    case'excluir':S.confirmarExcluir=true;render();break;
    case'fecharConf':S.confirmarExcluir=false;render();break;
    case'excluirSim':S.confirmarExcluir=false;S.lista=S.lista.filter(x=>x.id!==v.id);
      if(S.modo==='db'&&DB){clearTimeout(filaSalvar[v.id]);gravando=gravando.then(()=>DB.collection('vistorias').doc(v.id).delete()).catch(()=>toast('Não deu para excluir na nuvem.'))}else if(IDB.db)IDB.set('lista',JSON.parse(JSON.stringify(S.lista)));else lsSet('patio_vist_v1',S.lista.map(limpo));
      S.view='painel';S.cur=null;render();toast('Vistoria excluída.');break;
    case'pdf':gerarPDF(v);break;
  }
});
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.dataset&&t.dataset.act==='zona'){e.preventDefault();t.click()}if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='busca'){S.busca=t.value;const pos=t.selectionStart;render();const b=document.getElementById('busca');b.focus();try{b.setSelectionRange(pos,pos)}catch(_){};return}
  if(f==='avobs'){S.sheet.av.obs=t.value;return}
  let val=t.value;
  if(f==='placa'){val=val.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);t.value=val}
  S.cur[f]=val;if(f==='vistoriador')lsSet('patio_vistoriador',val);
  salvar(S.cur);
  if(f==='assinNome')atualizarRodape();
});
document.addEventListener('change',async e=>{
  const t=e.target;const file=t.files&&t.files[0];if(!file)return;
  if(t.dataset.foto){const k=t.dataset.foto,fd=FOTOS.find(x=>x.k===k);toast('Processando foto…');
    try{const r=await processarFoto(file,fd.n);S.cur.fotos=S.cur.fotos||{};S.cur.fotos[k]=r;salvar(S.cur);render();
      const prox=FOTOS.find(x=>!S.cur.fotos[x.k]);toast(prox?'Foto salva. Próxima: '+prox.n+'.':'Roteiro de fotos completo.')}catch(err){toast('Não deu para ler essa foto. Tente de novo.')}}
  if(t.dataset.fotoav){toast('Processando foto…');try{S.sheet.av.foto=await processarFoto(file,'Avaria: '+ZMAP[S.sheet.zona].n);render()}catch(err){toast('Não deu para ler essa foto.')}}
});
iniciar();
</script>

</body></html>
