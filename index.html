<style>
/* Layout: app de pátio, uma coluna para o polegar; painel → checklist veículo vendido (dados, 4 seções, avarias e assinaturas) → PDF. Alto contraste para sol. */
:root{
  --chao:#F6F6F4; --cartao:#FFFFFF; --tinta:#14233B; --tinta-2:#5D6B80; --linha:#DFE5EE;
  --acento:#111111; --acento-tx:#FFFFFF; --acento-bg:#FDF5DC; --ouro:#E9B421; --ouro-tx:#8A6406;
  --ok:#16794A; --ok-bg:#DFF1E7; --avaria:#C4321F; --avaria-bg:#FBE3DE; --aviso:#9A5B00; --aviso-bg:#FCEFD6;
  --zona:#E6E8EC; --corpo:#CDD2D9; --topo-bg:#111111;
  --placa-bg:#FFFFFF; --placa-faixa:#1747C9; --placa-tx:#101418;
  --f-disp:Poppins,system-ui,"Segoe UI",sans-serif;
  --f-txt:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
body{color-scheme:light;background:var(--chao);color:var(--tinta);font:15px/1.5 var(--f-txt);-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:16px;font-weight:600}
.sub{color:var(--tinta-2);font-size:14px}
.rotulo{font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}
button,input,textarea,select{font:inherit;color:inherit}

<script>
"use strict";
/* ---------- domínio: o checklist em papel da Platina, na mesma ordem ---------- */
const SECOES=[
  {n:1,t:'Iluminação',curto:'Ilumin.',itens:[
    {k:'farol_baixo',n:'Farol baixo'},{k:'farol_alto',n:'Farol alto'},{k:'lanterna',n:'Lanterna (posição)'},
    {k:'pisca_diant',n:'Pisca dianteiro',lados:1},{k:'pisca_tras',n:'Pisca traseiro',lados:1},{k:'pisca_retrov',n:'Pisca do retrovisor',lados:1},
    {k:'luz_freio',n:'Luz de freio + 3ª luz'},{k:'luz_re',n:'Luz de ré'},{k:'luz_placa',n:'Luz da placa'}]},
  {n:2,t:'Itens obrigatórios',curto:'Obrig.',itens:[
    {k:'estepe',n:'Estepe calibrado'},{k:'macaco',n:'Macaco'},{k:'chave_roda',n:'Chave de roda'},{k:'triangulo',n:'Triângulo'},{k:'porcas',n:'Porcas de roda (todas)'}]},
  {n:3,t:'Conferência interna',curto:'Interna',itens:[
    {k:'ar',n:'Ar-condicionado gelando'},{k:'vidros',n:'Vidros elétricos'},{k:'travas',n:'Travas elétricas'},{k:'retrov_el',n:'Retrovisores elétricos'},

  {n:4,t:'Entrega',curto:'Entrega',itens:[

    {k:'fotos',n:'Fotos: painel e 4 lados'},{k:'comb',n:'Combustível',comb:1}]}
];
const ITENS=SECOES.flatMap(s=>s.itens.map(i=>Object.assign({sec:s.n},i)));
const IMAP=Object.fromEntries(ITENS.map(i=>[i.k,i]));
const TOTAL=ITENS.length;
const PASSOS=[{n:'Dados',l:'Dados'},...SECOES.map(s=>({n:s.n+' '+s.curto,l:s.t})),{n:'5 Assinar',l:'Avarias e assinaturas'}];
const ULT=PASSOS.length-1;
const EST=[['ok','OK'],['pend','Pendente'],['na','N/A']];
const LEMA='Testar acionando, não só olhando.';

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dt=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dtLong=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const diaISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dataBR=s=>{if(!s)return'';const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
const hoje=iso=>{const d=new Date(iso),n=new Date();return d.toDateString()===n.toDateString()};
const fmtPlaca=p=>(p||'').toUpperCase();
const lsGet=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let toastT;
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}

/* ---------- respostas ---------- */
const temComb=v=>v.comb!=null&&v.comb!=='';
function resp(v,it,lado){const r=(v.r||{})[it.k];if(lado)return (r&&typeof r==='object'&&r[lado])||null;return typeof r==='string'?r:null}
function feitoItem(v,it){if(it.comb)return temComb(v);if(it.lados)return !!(resp(v,it,'D')&&resp(v,it,'E'));return !!resp(v,it)}
function pendItem(v,it){if(it.comb)return false;if(it.lados)return resp(v,it,'D')==='pend'||resp(v,it,'E')==='pend';return resp(v,it)==='pend'}
function prog(v){return {f:ITENS.filter(i=>feitoItem(v,i)).length,p:ITENS.filter(i=>pendItem(v,i)).length,t:TOTAL}}
const rotEst=e=>e==='ok'?'OK':e==='pend'?'Pendente':e==='na'?'N/A':'Falta conferir';
function txtItem(v,it){
  if(it.comb)return temComb(v)?v.comb+'/4':'Falta conferir';
  if(it.lados)return 'D '+rotEst(resp(v,it,'D'))+' · E '+rotEst(resp(v,it,'E'));
  return rotEst(resp(v,it));
}
function clsItem(v,it){
  if(pendItem(v,it))return 'p-av';
  if(!feitoItem(v,it))return 'p-pend';
  if(it.comb)return 'p-ok';
  const na=it.lados?resp(v,it,'D')==='na'&&resp(v,it,'E')==='na':resp(v,it)==='na';
  return na?'p-ex':'p-ok';
}

/* ---------- exemplos (não gravados) ---------- */
function exemplos(){
  const h=new Date();const at=(dd,hh,mm)=>{const d=new Date(h);d.setDate(d.getDate()-dd);d.setHours(hh,mm,0,0);return d.toISOString()};
  const tudo=ate=>{const r={};ITENS.filter(i=>!i.comb&&i.sec<=ate).forEach(i=>{r[i.k]=i.lados?{D:'ok',E:'ok'}:'ok'});return r};
  const r1=tudo(4);r1.multimidia='na';
  const r2=tudo(4);r2.chave_reserva='pend';
  const r3=tudo(2);r3.pisca_tras={D:'ok',E:'pend'};r3.ar='ok';r3.vidros='ok';r3.travas='ok';
  const base={exemplo:true,fotos:{},assinResp:null,assinCliente:null};
  return [
    Object.assign({},base,{id:'ex-3',placa:'QPX7B03',modelo:'HB20 Comfort 1.0 2020',cor:'Branco',km:'61.020',responsavel:'Exemplo',cliente:'Cliente de exemplo',data:diaISO(new Date(at(0,11,5))),criadoEm:at(0,11,5),concluidoEm:null,status:'rascunho',r:r3,comb:null,
      obsItem:{pisca_tras:'Lâmpada do lado esquerdo queimada. Trocar antes de entregar.'},obs:''}),
    Object.assign({},base,{id:'ex-2',placa:'RTB2C45',modelo:'Corolla XEi 2.0 2019',cor:'Preto',km:'72.400',responsavel:'Exemplo',cliente:'Cliente de exemplo',data:diaISO(new Date(at(0,9,30))),criadoEm:at(0,9,30),concluidoEm:at(0,9,58),status:'assinado',r:r2,comb:3,
      obsItem:{chave_reserva:'Chave reserva com o despachante. Cliente retira na semana que vem.'},obs:'Risco leve no para-choque traseiro, mostrado ao cliente.'}),
    Object.assign({},base,{id:'ex-1',placa:'RTA4E21',modelo:'Onix LTZ 1.0 Turbo 2021',cor:'Prata',km:'48.390',responsavel:'Exemplo',cliente:'Cliente de exemplo',data:diaISO(new Date(at(1,15,10))),criadoEm:at(1,15,10),concluidoEm:at(1,15,36),status:'assinado',r:r1,comb:4,
      obsItem:{multimidia:'Versão sem multimídia de fábrica.'},obs:''})
  ];
}

/* ---------- estado e armazenamento ---------- */
const S={lista:[],view:'painel',cur:null,step:0,filtro:'todos',busca:'',abertos:{},modo:'local',carregando:true};
const CACHE={}; // url -> dataURL para o PDF
let DB=null,ASSETS=null,DL=null;
const C=window.claude;
const cap=n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null);
const CHAVE='checklists_v1';

const IDB={db:null,abrir(){return new Promise(r=>{try{const q=indexedDB.open('patio',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})},
  get(k){return new Promise(r=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
  set(k,v){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}};
async function iniciar(){
  S.lista=lsGet('platina_'+CHAVE,[]);
  if(await IDB.abrir()){const l=await IDB.get(CHAVE);if(Array.isArray(l))S.lista=l}
  render();
  cap('assets').then(a=>{ASSETS=a});
  cap('downloads').then(d=>{DL=d});
  const limite=setTimeout(()=>{if(S.carregando){S.carregando=false;render()}},10000);
  cap('db').then(db=>{
    if(!db){clearTimeout(limite);S.carregando=false;render();return}
    DB=db;S.modo='db';
    db.collection('checklists').onSnapshot(snap=>{
      clearTimeout(limite);S.carregando=false;
      S.lista=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(S.view!=='editar')render();
    },err=>{clearTimeout(limite);S.carregando=false;S.modo='local';toast('Não deu para ler os checklists salvos. Trabalhando só neste aparelho.');render()});
  });
}
const filaSalvar={};
function salvar(v){
  if(v.exemplo)return;
  v.atualizadoEm=new Date().toISOString();
  const i=S.lista.findIndex(x=>x.id===v.id); if(i<0)S.lista.unshift(v); else S.lista[i]=v;
  clearTimeout(filaSalvar[v.id]);
  filaSalvar[v.id]=setTimeout(()=>gravar(v),700);
}
function limpo(v){
  const c=JSON.parse(JSON.stringify(v));
  const ok=f=>f&&f.url&&!String(f.url).startsWith('data:');
  Object.keys(c.fotos||{}).forEach(k=>{c.fotos[k]=(c.fotos[k]||[]).filter(ok);if(!c.fotos[k].length)delete c.fotos[k]});
  return c;
}
let gravando=Promise.resolve();
function gravarLocal(){if(IDB.db)IDB.set(CHAVE,JSON.parse(JSON.stringify(S.lista)));else lsSet('platina_'+CHAVE,S.lista.map(limpo))}
function gravar(v){
  if(S.modo==='db'&&DB){
    const dados=limpo(v);delete dados.id;
    gravando=gravando.then(()=>DB.collection('checklists').doc(v.id).set(dados)).catch(e=>{toast('Não salvou na nuvem: '+(e&&e.message||'erro')+'. Tente de novo.')});
  }else gravarLocal();
}
function listaVisivel(){return S.lista.length?S.lista:exemplos()}

/* ---------- foto: comprime e carimba placa, data e item ---------- */
function carregarImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function processarFoto(file,legenda){
  const url=URL.createObjectURL(file);
  try{
    const img=await carregarImg(url);const max=1600;const k=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.round(img.width*k),h=Math.round(img.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
    const bh=Math.max(28,Math.round(w*0.045));g.fillStyle='rgba(8,16,26,.72)';g.fillRect(0,h-bh,w,bh);
    g.fillStyle='#fff';g.font=`600 ${Math.round(bh*0.5)}px Poppins, Arial, sans-serif`;g.textBaseline='middle';
    g.fillText(`PLATINA  ·  ${fmtPlaca(S.cur.placa)||'SEM PLACA'}  ·  ${dtLong(new Date().toISOString())}  ·  ${legenda}`,Math.round(bh*0.4),h-bh/2);
    const dataUrl=c.toDataURL('image/jpeg',0.8);
    if(ASSETS){
      try{const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));const up=await ASSETS.upload(blob,{type:'image/jpeg'});CACHE[up.url]=dataUrl;return {id:up.id,url:up.url}}
      catch(e){toast('Foto ficou só neste aparelho: '+(e&&e.message||'envio falhou'))}
    }
    CACHE[dataUrl]=dataUrl;return {id:null,url:dataUrl};
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- assinatura ---------- */
function iniciarAssinaturas(){
  [['sig-resp','assinResp'],['sig-cli','assinCliente']].forEach(([id,campo])=>{
    const c=document.getElementById(id);if(!c)return;
    const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
    const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0F1E33';
    if(S.cur[campo])carregarImg(S.cur[campo]).then(i=>g.drawImage(i,0,0,r.width,r.height)).catch(()=>{});
    let des=false,ult=null;
    const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
    c.onpointerdown=e=>{des=true;ult=pt(e);c.setPointerCapture(e.pointerId)};
    c.onpointermove=e=>{if(!des)return;const p=pt(e);g.beginPath();g.moveTo(ult[0],ult[1]);g.lineTo(p[0],p[1]);g.stroke();ult=p};
    c.onpointerup=c.onpointercancel=()=>{if(!des)return;des=false;
      const o=document.createElement('canvas');o.width=600;o.height=200;const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,600,200);og.drawImage(c,0,0,600,200);
      S.cur[campo]=o.toDataURL('image/jpeg',0.7);salvar(S.cur);atualizarRodape()};
  });
}
function atualizarRodape(){
  const b=document.querySelector('[data-act="concluir"]');if(b)b.disabled=!podeConcluir(S.cur);
  const f=document.getElementById('falta');if(f){const m=faltaConcluir(S.cur);f.textContent=m.length?'Para concluir: '+m.join(', ')+'.':'Tudo pronto para concluir.'}
}

/* ---------- PDF: mesmo desenho do checklist em papel ---------- */
async function paraDataURL(url){
  if(!url)return null;if(CACHE[url])return CACHE[url];if(url.startsWith('data:'))return url;
  try{const b=await (await fetch(url)).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}catch(e){return null}
}
async function gerarPDF(v){
  if(!window.jspdf){toast('O gerador de PDF não carregou. Confira a internet e abra de novo.');return}
  toast('Montando o PDF…');

/* ---------- ações ---------- */
function novoChecklist(){
  S.cur={id:uid(),placa:'',modelo:'',cor:'',km:'',responsavel:lsGet('platina_responsavel',''),cliente:'',data:diaISO(new Date()),criadoEm:new Date().toISOString(),concluidoEm:null,status:'rascunho',r:{},comb:null,obsItem:{},fotos:{},obs:'',assinResp:null,assinCliente:null};
  S.abertos={};S.view='editar';S.step=0;render();scrollTo(0,0);
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('veu')&&e.target!==t)return;
  const a=t.dataset.act,v=S.cur;
  switch(a){
    case'nova':novoChecklist();break;
    case'filtro':S.filtro=t.dataset.v;render();break;
    case'abrir':{const x=listaVisivel().find(y=>y.id===t.dataset.id);if(!x)break;S.cur=JSON.parse(JSON.stringify(x));S.abertos={};S.view=x.status==='assinado'||x.exemplo?'ver':'editar';S.step=0;render();scrollTo(0,0);break}
    case'voltar':S.view='painel';S.cur=null;render();scrollTo(0,0);break;
    case'editar':S.view='editar';S.step=0;render();scrollTo(0,0);break;
    case'passo':S.step=+t.dataset.v;render();scrollTo(0,0);break;
    case'prox':S.step=Math.min(ULT,S.step+1);render();scrollTo(0,0);break;
    case'ant':S.step=Math.max(0,S.step-1);render();scrollTo(0,0);break;
    case'resp':{const k=t.dataset.k,l=t.dataset.l,val=t.dataset.v;v.r=v.r||{};
      if(l){const o=(v.r[k]&&typeof v.r[k]==='object')?v.r[k]:{};o[l]=o[l]===val?null:val;v.r[k]=o}
      else v.r[k]=v.r[k]===val?null:val;
      if(val==='pend'&&!(k in S.abertos))S.abertos[k]=true;
      salvar(v);render();break}
    case'comb':{const q=+t.dataset.v;v.comb=v.comb===q?null:q;salvar(v);render();break}
    case'det':{const k=t.dataset.k,it=IMAP[k];const atual=(k in S.abertos)?S.abertos[k]:pendItem(v,it);S.abertos[k]=!atual;render();break}
    case'tirarFoto':{const k=t.dataset.k;(v.fotos[k]||[]).splice(+t.dataset.i,1);if(!v.fotos[k].length)delete v.fotos[k];salvar(v);render();break}
    case'limparSig':{const c=document.getElementById('sig-'+t.dataset.v);c.getContext('2d').clearRect(0,0,c.width,c.height);v[t.dataset.v==='cli'?'assinCliente':'assinResp']=null;salvar(v);atualizarRodape();break}
    case'concluir':if(!podeConcluir(v))break;v.status='assinado';v.concluidoEm=new Date().toISOString();salvar(v);S.view='ver';render();scrollTo(0,0);toast('Checklist concluído e assinado.');break;
    case'excluir':S.confirmarExcluir=true;render();break;
    case'fecharConf':S.confirmarExcluir=false;render();break;
    case'excluirSim':S.confirmarExcluir=false;S.lista=S.lista.filter(x=>x.id!==v.id);
      if(S.modo==='db'&&DB){clearTimeout(filaSalvar[v.id]);gravando=gravando.then(()=>DB.collection('checklists').doc(v.id).delete()).catch(()=>toast('Não deu para excluir na nuvem.'))}else gravarLocal();
      S.view='painel';S.cur=null;render();toast('Checklist excluído.');break;
    case'pdf':gerarPDF(v);break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.confirmarExcluir){S.confirmarExcluir=false;render()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.fo){S.cur.obsItem=S.cur.obsItem||{};S.cur.obsItem[t.dataset.fo]=t.value;salvar(S.cur);return}
  const f=t.dataset.f;if(!f)return;
  if(f==='busca'){S.busca=t.value;const pos=t.selectionStart;render();const b=document.getElementById('busca');b.focus();try{b.setSelectionRange(pos,pos)}catch(_){};return}
  let val=t.value;
  if(f==='placa'){val=val.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);t.value=val}
  S.cur[f]=val;if(f==='responsavel')lsSet('platina_responsavel',val);
  salvar(S.cur);atualizarRodape();
});
document.addEventListener('change',async e=>{
  const t=e.target;const file=t.files&&t.files[0];if(!file||!t.dataset.fotoitem)return;
  const k=t.dataset.fotoitem,it=IMAP[k];toast('Processando foto…');
  try{const r=await processarFoto(file,it.n);S.cur.fotos=S.cur.fotos||{};(S.cur.fotos[k]=S.cur.fotos[k]||[]).push(r);S.abertos[k]=true;salvar(S.cur);render();toast('Foto salva em '+it.n+'.')}
  catch(err){toast('Não deu para ler essa foto. Tente de novo.')}
});
iniciar();
